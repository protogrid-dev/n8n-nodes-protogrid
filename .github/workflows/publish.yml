# Publishes @protogrid/n8n-nodes-protogrid to npm with a provenance statement when a version tag (0.1.2) is pushed.
# npm trusted publishing (OIDC): the package's settings on npmjs.com name this repository and this workflow, so no
# token is stored here. The tag must match package.json's version.
name: publish
on:
  push:
    tags: ['*.*.*']
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, registry-url: 'https://registry.npmjs.org', cache: npm }
      - run: npm install -g npm@latest
      - name: check tag matches package version
        run: test "$(node -p 'require("./package.json").version')" = "${{ github.ref_name }}"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
